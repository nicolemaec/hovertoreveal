<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hover Reveal Notes</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1e1e2f;
      color: #d4d4d4;
      padding: 2rem;
      display: flex;
      justify-content: center;
      box-sizing: border-box;
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    .note {
      margin: 1rem 0;
    }

    .spoiler {
      background-color: #2d2d3a;
      color: #2d2d3a;
      border-radius: 4px;
      padding: 0 0.3rem;
      transition: color 0.3s ease;
      cursor: pointer;
    }

    .spoiler:hover,
    .spoiler.revealed {
      color: #ffffff;
    }

    h1, h2 {
      color: #ffffff;
    }

    .toggle-btn {
      background-color: #3a3a4d;
      color: #ffffff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 1.5rem;
    }

    .toggle-btn:hover {
      background-color: #50506b;
    }

    .note input[type="checkbox"] {
      margin-right: 0.5rem;
      transform: scale(1.2);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hover-to-Reveal Notes</h1>
    <div class="note">
      Paste your notes here with <u>span class="spoiler"</u> to hide all the answers.<br>
      Use the bold-to-spoiler converter for easier use. Click "Reveal All" to show all answers.<br>
      ❤️
    </div>

    <button class="toggle-btn" onclick="toggleReveal()">Reveal All</button>

    <h2>Critical Care Notes</h2>

    <!-- Your note blocks go here -->


<div class="note">
  <label>
    <input type="checkbox" class="line-toggle" onchange="toggleOne(this)">
    <span>·<span> </span></span><span dir="LTR"></span><u>Cardiac arrest</u> <span>·<span> </span></span><span dir="LTR"></span>For ventricular fibrillation or pulseless ventricular tachycardia, <span class="spoiler">electrical therapy (by an automated external defibrillator or defibrillator)</span> should be initiated as soon as it is available.
  </label>
</div>

<div class="note">
  <label>
    <input type="checkbox" class="line-toggle" onchange="toggleOne(this)">
    <span>·<span> </span></span><span dir="LTR"></span>c. <span class="spoiler">Intraosseous</span> medication administration is preferred to <span class="spoiler">endotracheal</span> administration if intravenous administration is not possible because of its more predictable drug delivery and pharmacologic effect.
  </label>
</div>

<div class="note">
  <label>
    <input type="checkbox" class="line-toggle" onchange="toggleOne(this)">
    <span>·<span> </span></span><span dir="LTR"></span>d. Endotracheal drug administration can be performed by administering <span class="spoiler"> 2–2.5 times the standard intravenous dose and diluting in 5</span><span class="spoiler">-10 mL of sterile water</span>. The following drugs can be administered through an endotracheal tube: <span class="spoiler">naloxone, atropine, epinephrine, lidocaine</span>.
  </label>
</div>

<div class="note">
  <label>
    <input type="checkbox" class="line-toggle" onchange="toggleOne(this)">
    <span>·<span> </span></span><span dir="LTR"></span><u>Post cardiac arrest care</u> <span>·<span> </span></span><span dir="LTR"></span>After ROSC, systematic post-cardiac arrest care can improve survival and quality of life.
  </label>
</div>

<div class="note">
  <label>
    <input type="checkbox" class="line-toggle" onchange="toggleOne(this)">
    <span>·<span> </span></span><span dir="LTR"></span>Initial therapy should optimize ventilation, oxygenation, and blood pressure. O2 SAT should be 94% or higher; hypotension should be treated with fluid boluses or pressors. Avoidance of hyperthermia is recommended because why? And how to manage this - <span class="spoiler">fever in patients after cardiac arrest is associated with poor neurologic outcomes (TTM management =&gt; 32-36 C for at least 24 hours as soon as possible)</span>.
  </label>
</div>

<div class="note">
  <label>
    <input type="checkbox" class="line-toggle" onchange="toggleOne(this)">
    <span>·<span> </span></span><span dir="LTR"></span>e. Rewarming should be done slowly (0.3-0.5 C every hour) and patients should remain afebrile.
  </label>
</div>

<div class="note">
  <label>
    <input type="checkbox" class="line-toggle" onchange="toggleOne(this)">
    <span>·<span> </span></span><span dir="LTR"></span>Complications of TTM =&gt; shivering, hypothermia, altered drug metabolism, coagulopathy, arrhythmia and hypotension, hyperglycemia, hypoglycemia, infection, electrolyte distrubances <span>·<span> </span></span><span dir="LTR"></span>-Shivering – excess heat production, increased O2 consumption; treat this with <span class="spoiler">sedatives (dexmedetomidine, ketamine) , anesthetics, analgesics, dexamethasone, clonidine, magnesium, ondansetron, buspirone, paralytics; </span>In terms of agents for shivering avoid <span class="spoiler">paralytics </span>if possible.
  </label>
</div>

<div class="note">
  <label>
    <input type="checkbox" class="line-toggle" onchange="toggleOne(this)">
    <span>·<span> </span></span><span dir="LTR"></span>-Altered drug metabolism during TTM; how? – <span class="spoiler">reduced drug clearance[reduced CYP activity]; distribution of drugs to their site of action (propofol) </span> <span>·<span> </span></span><span dir="LTR"></span><u>Acute respiratory failure</u> <span>·<span> </span></span><span dir="LTR"></span>Indications for mechanical ventilation – <span class="spoiler">hypoventilation (drug overdose, neuromuscular disease, CPR, CNS injury or disease); hypoxemia, inability to maintain airway</span> <span>·<span> </span></span><span dir="LTR"></span>Common complications with mechanical ventilation <span class="spoiler">-VAP, stress ulcers, venous thrombosis</span> <span>·<span> </span></span><span dir="LTR"></span><u>Pain, agitation, delirium, and neuromuscular blockade</u> <span>·<span> </span></span><span dir="LTR"></span>Goal BPS – <span class="spoiler">5 or less</span> <span>·<span> </span></span><span dir="LTR"></span>Goal CPOT – <span class="spoiler">2 or less</span> <span>·<span> </span></span><span dir="LTR"></span>Goal RASS – <span class="spoiler">0 to -1</span> <span>·<span> </span></span><span dir="LTR"></span>Goal SAS – <span class="spoiler">3 to 4 </span> <span>·<span> </span></span><span dir="LTR"></span>Common causes of agitation – <span class="spoiler">pain and discomfort; therefore, treat pain first then add sedative as needed</span> <span>·<span> </span></span><span dir="LTR"></span>Non neuropathic pain treatment = <span class="spoiler">opioid analgesics + nonopioids for multimodal (acetaminophen, ketamine); </span>neuropathic pain – <span class="spoiler">gabapentin or carbamazepine (gabapentin  is better tolerated); </span>avoid this for pain and why – <span class="spoiler">nsaids; risk of bleeding and kidney injury high</span> <span>·<span> </span></span><span dir="LTR"></span>Light level sedation is preferred because <span class="spoiler">allows for patient interaction to evaluate pain and delirium </span> <span>·<span> </span></span><span dir="LTR"></span>If unable to achieve pain and sedation doses with intermittent dosing, do what? – <span class="spoiler">use a bolus dose instead of increasing infusion rate (except certain drugs)</span> <span>·<span> </span></span><span dir="LTR"></span>Do not bolus with <span class="spoiler">propofol or dexmedetomidine </span>due to hypotension and bradycardia risk <span>·<span> </span></span><span dir="LTR"></span>A scheduled <span class="spoiler">daily interruption of continuous infusion </span>is associated with benefits of assessing neuro function, re-evaluate lowest effective opioid or sedative dose, preventing drug accumulation and overdose, reducing time on the ventilator, reduce mortality and ICU LOS, symptoms of PTSD and post-ICU syndrome <span>·<span> </span></span><span dir="LTR"></span><u>Sedatives</u> <span>·<span> </span></span><span dir="LTR"></span>Preferred sedatives per guidelines are <span class="spoiler">propofol or dexmedetomidine (over BZDs); </span>increased ICU LOS, reduces duration of mechanical ventilation, reduces development of delirium <span>·<span> </span></span><span dir="LTR"></span>Propylene glycol toxicity associated with? And what doses and for how long? How to know? – <span class="spoiler">lorazepam continuous infusion; doses as low as 1 mg/kg; &gt;48 hrs; AG &gt; 10-12</span> <span>·<span> </span></span><span dir="LTR"></span>Preferred benzo as sedative and why – <span class="spoiler">lorazepam; preferred for hepatic dysfunction; lack of metabolism with lack of active metabolites</span> <span>·<span> </span></span><span dir="LTR"></span>Preferred benzo for procedural sedation and why – <span class="spoiler">midazolam; rapid onset and short duration (also good for daily dressing changes)</span> <span>·<span> </span></span><span dir="LTR"></span>Prolonged infusions of <span class="spoiler">midazolam </span>may accumulate because of its greater lipophilicity and active metabolites; especially in patients with renal dysfunction <span>·<span> </span></span><span dir="LTR"></span><span class="spoiler">Diazepam </span>is not routinely used for sedation due to accumulation of active metabolites with prolonged admin; <span>·<span> </span></span><span dir="LTR"></span>Diazepam is often used for treatment of what and why? <span class="spoiler">alcohol withdrawal – rapid onset, long half life</span> <span>·<span> </span></span><span dir="LTR"></span>What max rate to avoid propofol at and why – <span class="spoiler">80 mcg/kg/min; risk of developing PRIS</span> <span>·<span> </span></span><span dir="LTR"></span>Can only use <span class="spoiler">propofol continuous infusion </span>in intubated patients because of the risk of respiratory depression <span>·<span> </span></span><span dir="LTR"></span><span class="spoiler">Propofol </span>has no significant analgesic activity <span>·<span> </span></span><span dir="LTR"></span>When to monitor for PRIS in propofol use? When to consider alternative? – <span class="spoiler">obtain triglyceride concentrations when propofol is used &gt; 48 hours OR rate &gt; 50 mcg/kg/min =&gt; risk of pancreatitis =&gt; consider alternative when Triglycerides &gt; 500-800 mg/dL</span> <span>·<span> </span></span><span dir="LTR"></span>Why is propofol more commonly used than benzos? <span class="spoiler">Shorter duration, easy to titrate, predictable</span> <span>·<span> </span></span><span dir="LTR"></span>Dexmedetomidine MOA – <span class="spoiler">central and peripheral alpha-2 agonist activity</span> <span>·<span> </span></span><span dir="LTR"></span><span class="spoiler">Dexmedetomidine </span>does not cause respiratory depression <span>·<span> </span></span><span dir="LTR"></span>A loading dose of <span class="spoiler">dexmedetomidine </span>is suggested for patients undergoing surgery; however, loading doses are not recommended due to risk of bradycardia and hypotension <span>·<span> </span></span><span dir="LTR"></span>Primary adverse effects of dexmedetomidine – <span class="spoiler">dose-related bradycardia and hypotension</span> <span>·<span> </span></span><span dir="LTR"></span>Withdrawal symptoms (nausea, vomiting, agitation) have been associated with <span class="spoiler">dexmedetomidine</span> after 1 week of use <span>·<span> </span></span><span dir="LTR"></span><span class="spoiler">Ketamine</span> has both analgesic and sedative properties <span>·<span> </span></span><span dir="LTR"></span><span class="spoiler">Ketamine </span>does not cause respiratory depression but dose cause bronchodilation, making this beneficial in patients with asthma or COPD <span>·<span> </span></span><span dir="LTR"></span>Ketamine has risk of <span class="spoiler">emergency delirium </span>when high doses are tapered of <span>·<span> </span></span><span dir="LTR"></span>Ketamine adverse effects – <span class="spoiler">hypertension, tachycardia, delirium</span> <span>·<span> </span></span><span dir="LTR"></span>Ketamine use in the guidelines? – <span class="spoiler">low-dose ketamine as an adjunct to opioid therapy when seeking to reduce opioid use in post-surgical patients</span> <span>·<span> </span></span><span dir="LTR"></span><u>Delirium </u> <span>·<span> </span></span><span dir="LTR"></span>Doses of haloperidol for acute agitation can be <span class="spoiler">doubled every 20 minutes until an effective dose is reached.</span> <span>·<span> </span></span><span dir="LTR"></span><span class="spoiler">Atypical or SGAs </span>can reduce duration of delirium in critically ill patients.
  </label>
</div>

<div class="note">
  <label>
    <input type="checkbox" class="line-toggle" onchange="toggleOne(this)">
    <span>·<span> </span></span><span dir="LTR"></span>Agents with a shorter-half life <span class="spoiler">(quetiapine) </span>act faster and can be quickly titrated; <span class="spoiler">olanzapine and risperidone </span>have less risk of QTC prolongation but should still be monitored <span>·<span> </span></span><span dir="LTR"></span>Neuromuscular blockade is typically indicated for <span class="spoiler">intubated pts with severe respiratory failure (ARDS, status asthmaticus) despite optimization of analgesia, sedation, and ventilator management</span> <span>·<span> </span></span><span dir="LTR"></span>In patients with severe ARDS, what has been studied– <span class="spoiler">48-hour infusion of cisatracurium (lack of clear benefits in data; NMBAs should be reserved for patients who are persistently hypoxemic or risk of ventilator injury despite deeper sedation)</span> <span>·<span> </span></span><span dir="LTR"></span>NMBAs have been used as adjunctive agents to <span class="spoiler">control severe ICH in patients with neurologic injury (TBI)</span> <span>·<span> </span></span><span dir="LTR"></span>NMBAs are typically used when? <span class="spoiler">when efforts to facilitate ventilation have failed and high-dose opioids and sedatives have also failed</span> <span>·<span> </span></span><span dir="LTR"></span>NMBAs should ONLY be used in conjunction with<span class="spoiler"> a continuous infused sedative with amnestic properties (so avoid dexmedetomidine)</span> <span>·<span> </span></span><span dir="LTR"></span>Risks associated with NMBAs – <span class="spoiler">critical illness polyneuropmyopathy (prolonged muscle weakness); increased VTE risk; corneal abrasions (eye dryness and lack of blinking; add ophthalmic ointment every 5-8 hours); mask insufficient analgesia and sedation, seizure activity, risk of skin breakdown and decubitus </span> <span>·<span> </span></span><span dir="LTR"></span>PRINCIPLE ADVERSE EFFECT OF NMBAS (can occur even if dosed appropriately) – <span class="spoiler">prolonged muscle weakness which slows patient recovery etc</span> <span>·<span> </span></span><span dir="LTR"></span>Drug holiday is recommended for patients on <span class="spoiler">paralytic infusion – helps assess agitation, need for continued blockade, assess the dose</span> <span>·<span> </span></span><span dir="LTR"></span>Just note that other drugs can potentiate or antagonize block of NMBAs
  </label>
</div>
    <!-- Just make sure checkboxes don't have any onchange logic now -->

  </div>

  <script>
    let revealed = false;

    function toggleReveal() {
      const spoilers = document.querySelectorAll('.spoiler');
      spoilers.forEach(el => {
        if (revealed) {
          el.classList.remove('revealed');
        } else {
          el.classList.add('revealed');
        }
      });
      revealed = !revealed;
      document.querySelector('.toggle-btn').textContent = revealed ? 'Hide All' : 'Reveal All';
    }
  </script>
</body>
</html>
