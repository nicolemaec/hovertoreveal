<!DOCTYPE html>

  <title>Hover Reveal Notes</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1e1e2f;
      color: #d4d4d4;
      padding: 2rem;
      display: flex;
      justify-content: center;
      box-sizing: border-box;
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    .note {
      margin: 1rem 0;
    }

    .spoiler {
      background-color: #2d2d3a;
      color: #2d2d3a;
      border-radius: 4px;
      padding: 0 0.3rem;
      transition: color 0.3s ease;
      cursor: pointer;
    }

    .spoiler:hover,
    .spoiler.revealed {
      color: #ffffff;
    }

    h1, h2 {
      color: #ffffff;
    }

    .toggle-btn {
      background-color: #3a3a4d;
      color: #ffffff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 1.5rem;
    }

    .toggle-btn:hover {
      background-color: #50506b;
    }

    .note input[type="checkbox"] {
      margin-right: 0.5rem;
      transform: scale(1.2);
      cursor: pointer;
    }
  </style>
</head>

in patients after cardiac arrest is associated with poor neurologic outcomes
(TTM management =&gt; 32-36 C for at least 24 hours as soon as possible)</span>.<o:p></o:p>
