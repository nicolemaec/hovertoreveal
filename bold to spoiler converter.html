<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bold to Spoiler with Line Toggle</title>
  <style>
    body {
      background-color: #1e1e2f;
      color: #d4d4d4;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 2rem;
    }
    #input {
      width: 100%;
      height: 200px;
      background-color: #2d2d3a;
      color: #ffffff;
      border: none;
      padding: 1rem;
      border-radius: 5px;
      margin-bottom: 1rem;
      overflow-y: auto;
    }
    button {
      background-color: #3a3a4d;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 0.5rem;
    }
    textarea#htmlOutput {
      background-color: #1a1a2a;
      color: #d4d4d4;
      padding: 1rem;
      margin-top: 0.5rem;
      border-radius: 5px;
      font-family: monospace;
      width: 100%;
      height: 400px;
      resize: vertical;
    }
    .spoiler {
      background-color: #2d2d3a;
      color: #2d2d3a;
      border-radius: 4px;
      padding: 0 0.3rem;
      transition: color 0.3s ease;
      cursor: pointer;
    }
    .spoiler:hover,
    .spoiler.revealed {
      color: #ffffff;
    }
    #copyMessage {
      opacity: 0;
      transition: opacity 0.4s ease;
      color: #90ee90;
      font-size: 0.9rem;
      margin-top: 0.5rem;
      height: 1rem;
    }
    #copyMessage.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <h1>Bold to Spoiler + Line Toggle Generator</h1>
  <div contenteditable="true" id="input" placeholder="Paste your notes here..."></div>
  <button onclick="convert()">Convert</button>
  <button onclick="copyHTML()">Copy HTML</button>

  <h3>Generated HTML Output:</h3>
  <div id="copyMessage">Copied to clipboard! ⭐</div>
  <textarea id="htmlOutput" readonly></textarea>

  <script>
    function convert() {
      const inputElement = document.getElementById('input');
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = inputElement.innerHTML;

      // Remove Microsoft Word junk
      const garbageSpans = tempDiv.querySelectorAll('span');
      garbageSpans.forEach(el => {
        if (el.style && Object.keys(el.style).length > 0) {
          el.removeAttribute('style');
        }
      });

      // Convert bolds to spoilers
      const boldElements = tempDiv.querySelectorAll('b, strong, span');
      boldElements.forEach(el => {
        const isBold = el.tagName === 'B' || el.tagName === 'STRONG' ||
          (el.style.fontWeight && (el.style.fontWeight === 'bold' || parseInt(el.style.fontWeight) >= 600));
        if (isBold) {
          const span = document.createElement('span');
          span.className = 'spoiler';
          span.innerHTML = el.innerHTML;
          el.replaceWith(span);
        }
      });

      let raw = tempDiv.innerHTML
        .replace(/<!--.*?-->/gs, '') // remove comment junk
        .replace(/<p[^>]*>/gi, '')
        .replace(/<\/p>/gi, '\n')
        .replace(/<o:p>|<\/o:p>/gi, '')
        .replace(/&nbsp;/gi, ' ');

      // Clean up and merge broken lines unless they end in punctuation
      const lines = raw.split(/\n+/);
      const merged = [];
      let current = '';
      for (let line of lines) {
        const trimmed = line.trim();
        if (!trimmed) continue;
        current += (current ? ' ' : '') + trimmed;
        if (/[.!?]$/.test(trimmed)) {
          merged.push(current);
          current = '';
        }
      }
      if (current) merged.push(current);

      // Wrap each in <div class="note">
      const wrapped = merged.map(line => `
<div class="note">
  <label>
    <input type="checkbox" class="line-toggle" onchange="toggleOne(this)">
    ${line}
  </label>
</div>`).join('\n');

      document.getElementById('htmlOutput').value = wrapped;
    }

    function copyHTML() {
      const html = document.getElementById('htmlOutput');
      html.select();
      html.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(html.value).then(() => {
        const message = document.getElementById('copyMessage');
        message.classList.add('visible');
        setTimeout(() => {
          message.classList.remove('visible');
        }, 2000);
      });
    }

    function toggleOne(checkbox) {
      const spoiler = checkbox.closest('.note').querySelector('.spoiler');
      if (spoiler) {
        if (checkbox.checked) {
          spoiler.classList.add('revealed');
        } else {
          spoiler.classList.remove('revealed');
        }
      }
    }
  </script>
</body>
</html>
