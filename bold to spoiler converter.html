<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bold to Spoiler Converter V4</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1e1e2f;
      color: #d4d4d4;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #inputArea, textarea {
      width: 90%;
      max-width: 800px;
      height: 200px;
      margin-bottom: 1rem;
      padding: 1rem;
      background-color: #2d2d3a;
      color: #ffffff;
      border: 1px solid #444;
      border-radius: 6px;
      font-size: 1rem;
    }

    #inputArea {
      overflow-y: auto;
      white-space: normal;
    }

    button {
      background-color: #3a3a4d;
      color: #ffffff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    button:hover {
      background-color: #50506b;
    }
  </style>
</head>
<body>
  <h1>Bold to Spoiler Converter V4 heart heart</h1>
  <div id="inputArea" contenteditable="true" placeholder="Paste here from Word..."></div>
  <button onclick="convertText()">Convert</button>
  <textarea id="outputText" placeholder="Converted output will appear here..."></textarea>

  <script>
function convertText() {
  const inputDiv = document.getElementById('inputArea');
  let html = inputDiv.innerHTML;

// Remove Word-specific junk
html = html.replace(/<o:p>\s*<\/o:p>/gi, '');
html = html.replace(/<o:p>.*?<\/o:p>/gi, '');
html = html.replace(/\sclass=("MsoNormal"|[^"']*)/gi, '');
html = html.replace(/<p[^>]*>/gi, '');
html = html.replace(/<\/p>/gi, '<br>');

// Convert inline bold styles to <b>
html = html.replace(/<span[^>]*?style=["'][^"']*?font-weight\s*:\s*bold;?[^"']*?["'][^>]*?>(.*?)<\/span>/gi, '<b>$1</b>');

// Replace <b> and <strong> with spoiler spans
html = html.replace(/<(b|strong)>/gi, '<span class="spoiler">');
html = html.replace(/<\/(b|strong)>/gi, '</span>');


// Split ONLY by <br>, but keep tables as single blocks
const lines = html
  .split(/<br\s*\/?>/i)
  .map(line => line.trim())
  .filter(line => line.length > 0)
  .reduce((result, line) => {
    if (line.includes('<table')) {
      const tableMatch = html.match(/<table[\s\S]*?<\/table>/i);
      if (tableMatch) {
        result.push(tableMatch[0]);
        html = html.replace(tableMatch[0], ''); // remove table from remaining HTML
      }
    } else {
      result.push(line);
    }
    return result;
  }, []);



  // Wrap each line
  const converted = lines.map(line => {
    return `<div class="note">\n  <label>\n    <input type="checkbox" class="line-toggle">\n    ${line}\n  </label>\n</div>`;
  }).join('\n\n');

  document.getElementById('outputText').value = converted;
}

  </script>
</body>
</html>
